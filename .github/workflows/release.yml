name: Windows Portable Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Windows portable package
        shell: pwsh
        run: |
          ./build-portable.ps1
          $archive = 'codex-tps-live-windows-amd64.zip'
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS'), "$checksum  $archive`n", [System.Text.UTF8Encoding]::new($false))
      - uses: softprops/action-gh-release@v2
        with:
          name: Codex TPS Live ${{ github.ref_name }}
          body: |
            Windows 10/11 x64 本地 Codex token 与 TPS 实时监控工具。

            本次更新：
            - 额度趋势补上 12 小时快捷范围，自定义起止时间直接显示，区分快捷滚动范围与自定义固定范围。
            - 修复稀疏上报中孤立旧额度快照导致误分段、丢失校准依据的问题；持续回退、重置和超过 6 小时的空窗仍会重新分段，首个不完整区间仍不参与校准。
            - 趋势滤波时间窗口在按 Enter 或离开输入框后才应用，输入过程中不逐字重算，数值未变时跳过重算。
            - 对话标题优先读取本地 session_index.jsonl 的最新名称，修复分支对话误显示 Referenced chats 注入说明的问题；列表与详情统一，缺少索引名称时使用有效用户文本预览。

            1. 下载下方 Assets 中的 `codex-tps-live-windows-amd64.zip`。
            2. 完整解压到任意目录。
            3. 双击 `启动监控.cmd`，程序会打开本机浏览器面板。

            压缩包包含 `codex-tps-live.exe`、`启动监控.cmd`、中英文说明 `使用说明.md` / `Usage.en.md`，以及 MIT 英文原文 `LICENSE` / 中文译文 `LICENSE.zh-CN.md`。
            无需安装 Go、Node 或 Python；页面资源全部内嵌，只读本机日志，不代理或修改 Codex 请求。

            使用方法与统计口径见压缩包中的 `使用说明.md`。

            Download `codex-tps-live-windows-amd64.zip`, extract all files, and double-click `启动监控.cmd` to open the local dashboard. Windows 10/11 x64 is supported; no Go, Node, Python, or internet connection is needed at runtime. English instructions are included in `Usage.en.md`.

            Changes in this release:
            - Adds a 12-hour quota preset and always-visible custom start/end fields, distinguishing rolling presets from fixed custom ranges.
            - Preserves quota calibration across isolated stale snapshots followed by sparse recovery reports. Sustained rollbacks, resets, and reporting gaps over six hours still start new segments; the initial incomplete interval remains excluded.
            - Applies trend smoothing window edits on Enter or blur rather than every keystroke, and skips unchanged values.
            - Uses the latest local session_index.jsonl name for conversation titles, fixing forked chats labeled with injected Referenced chats notices. Lists and details share this priority, with valid user-text previews as fallback.
          files: |
            codex-tps-live-windows-amd64.zip
            SHA256SUMS
