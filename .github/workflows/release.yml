name: Windows Portable Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Windows portable package
        shell: pwsh
        run: |
          ./build-portable.ps1
          $taskChecksums = foreach ($taskAsset in @('codex-tps-live-windows-amd64.zip', 'dist/codex-tps-live.exe')) {
            $taskHash = (Get-FileHash -LiteralPath $taskAsset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$taskHash  $([System.IO.Path]::GetFileName($taskAsset))"
          }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS'), (($taskChecksums -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
      - name: Read release notes from tag
        shell: pwsh
        run: |
          $taskNotes = git for-each-ref --format='%(if:equals=tag)%(objecttype)%(then)%(contents)%(end)' $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { throw "Could not read release tag notes." }
          if ($taskNotes) {
            [System.IO.File]::WriteAllText((Join-Path $PWD 'release-notes.md'), ($taskNotes -join "`n"))
          }
      - uses: softprops/action-gh-release@v2
        with:
          name: Codex TPS Live ${{ github.ref_name }}
          body_path: release-notes.md
          body: Download and extract the portable ZIP, then run `启动监控.cmd`. See the bundled Chinese and English guides.
          files: |
            codex-tps-live-windows-amd64.zip
            dist/codex-tps-live.exe
            SHA256SUMS
