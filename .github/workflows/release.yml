name: Windows Portable Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Windows portable package
        shell: pwsh
        run: |
          ./build-portable.ps1
          $taskChecksums = foreach ($taskAsset in @('codex-tps-live-windows-amd64.zip', 'dist/codex-tps-live.exe')) {
            $taskHash = (Get-FileHash -LiteralPath $taskAsset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$taskHash  $([System.IO.Path]::GetFileName($taskAsset))"
          }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS'), (($taskChecksums -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
      - uses: softprops/action-gh-release@v2
        with:
          name: Codex TPS Live ${{ github.ref_name }}
          body: |
            Windows 10/11 x64 本地 Codex token 与 TPS 实时监控工具。

            本次更新：
            - 修复子代理日志中的继承父会话元数据覆盖当前身份，导致父对话显示成子代理模型、漏显用量或混入旧轮次的问题。
            - 每份日志由首个有效 session_meta.id 确定归属，后续不同 ID 的元数据不再覆盖身份、父关联和代理名称。
            - 继承历史从匹配本文件所属对话的 thread_settings_applied.thread_id 边界开始计量；受影响日志从头分批重建，界面仍遵循最近 N 轮范围。
            - 重放时兼容并复用旧额度检查点，避免身份修正后重复累计；保留原始日志和额度历史。
            - 同步更新中英文说明。已对照原始日志核对父对话、子代理和归档子代理的用量，并核对旧额度记录未重复新增。

            1. 下载下方 Assets 中的 `codex-tps-live-windows-amd64.zip`。
            2. 完整解压到任意目录。
            3. 双击 `启动监控.cmd`，程序会打开本机浏览器面板。

            压缩包包含 `codex-tps-live.exe`、`启动监控.cmd`、中英文说明 `使用说明.md` / `Usage.en.md`，以及 MIT 英文原文 `LICENSE` / 中文译文 `LICENSE.zh-CN.md`。
            无需安装 Go、Node 或 Python；页面资源全部内嵌，只读本机日志，不代理或修改 Codex 请求。

            使用方法与统计口径见压缩包中的 `使用说明.md`。
            也可单独下载 `codex-tps-live.exe`，运行时加 `--open` 打开浏览器；完整 ZIP 另附启动器、双语说明和许可证。`SHA256SUMS` 提供 ZIP 与 EXE 的校验值。

            Download `codex-tps-live-windows-amd64.zip`, extract all files, and double-click `启动监控.cmd` to open the local dashboard. Windows 10/11 x64 is supported; no Go, Node, Python, or internet connection is needed at runtime. English instructions are included in `Usage.en.md`.

            Changes in this release:
            - Fixes inherited parent metadata in subagent logs replacing the log's identity, causing parent conversations to show a subagent model, omit usage, or include inherited turns.
            - Establishes ownership from the first valid session_meta.id. Later metadata with a different ID cannot replace the conversation identity, parent link, or agent name.
            - Counts requests after a thread_settings_applied.thread_id boundary explicitly matching the log's owner. Affected logs are replayed progressively from the beginning while the dashboard retains its selected N-turn window.
            - Reuses existing quota checkpoints during replay to avoid counting usage twice under the corrected identity. Original logs and quota history are retained.
            - Updates both language guides. Parent, subagent, and archived-subagent usage was checked against original logs, including verification that existing quota checkpoints were not duplicated.

            The standalone `codex-tps-live.exe` is also available; run it with `--open` to open the browser. The ZIP additionally includes the launcher, bilingual guides, and licenses. `SHA256SUMS` covers both downloads.
          files: |
            codex-tps-live-windows-amd64.zip
            dist/codex-tps-live.exe
            SHA256SUMS
