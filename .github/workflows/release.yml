name: Windows Portable Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Windows portable package
        shell: pwsh
        run: |
          ./build-portable.ps1
          $archive = 'codex-tps-live-windows-amd64.zip'
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS'), "$checksum  $archive`n", [System.Text.UTF8Encoding]::new($false))
      - uses: softprops/action-gh-release@v2
        with:
          name: Codex TPS Live ${{ github.ref_name }}
          body: |
            Windows 10/11 x64 本地 Codex token 与 TPS 实时监控工具。

            本次更新：
            - 额度校准使用截至所选结束时间的完整历史，切换图表时间范围不再改变校准基线；继续排除首个不完整百分点区间。
            - 修正速度趋势的默认纵轴、自适应和恢复全图：默认按可见趋势曲线确定比例，原始极值可通过“查看全部散点”单独查看。
            - 滚轮缩放以鼠标位置为中心；Shift 只缩放纵轴，Ctrl 只缩放横轴。自适应留白不再受之前的缩放影响。
            - 切换原始散点保留缩放，切换图例保留手动时间范围并重算纵轴；完善空时间段与全部曲线隐藏时的提示和操作状态。

            1. 下载下方 Assets 中的 `codex-tps-live-windows-amd64.zip`。
            2. 完整解压到任意目录。
            3. 双击 `启动监控.cmd`，程序会打开本机浏览器面板。

            压缩包包含 `codex-tps-live.exe`、`启动监控.cmd`、中英文说明 `使用说明.md` / `Usage.en.md`，以及 MIT 英文原文 `LICENSE` / 中文译文 `LICENSE.zh-CN.md`。
            无需安装 Go、Node 或 Python；页面资源全部内嵌，只读本机日志，不代理或修改 Codex 请求。

            使用方法与统计口径见压缩包中的 `使用说明.md`。

            Download `codex-tps-live-windows-amd64.zip`, extract all files, and double-click `启动监控.cmd` to open the local dashboard. Windows 10/11 x64 is supported; no Go, Node, Python, or internet connection is needed at runtime. English instructions are included in `Usage.en.md`.

            Changes in this release:
            - Quota calibration uses all history up to the selected end time, so changing the displayed time range no longer shifts the calibration baseline. The initial incomplete percentage interval remains excluded.
            - Corrects default trend scaling, fit, and reset. Raw outliers have a separate “Show all raw points” action.
            - Anchors wheel zoom to the pointer, with Shift for Y only and Ctrl for X only. Fit padding no longer depends on previous zoom.
            - Preserves zoom when toggling raw points and the manual time range when toggling a series, while refitting Y. Improves empty-range and all-hidden states.
          files: |
            codex-tps-live-windows-amd64.zip
            SHA256SUMS
