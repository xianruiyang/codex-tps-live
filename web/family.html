<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>代理消耗统计 · Codex TPS Live</title>
<style>
:root{color-scheme:dark;--bg:#101317;--panel:#171c22;--raised:#202730;--border:#35404d;--text:#ecf1f6;--muted:#aebac8;--accent:#79d8bd;--accent-bg:#203d35;--warn:#f7ca85}
:root.light{color-scheme:light;--bg:#f3f5f8;--panel:#fff;--raised:#eaf0f5;--border:#c8d2dd;--text:#182532;--muted:#526477;--accent:#17634f;--accent-bg:#dcf3e9;--warn:#805000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,a{font:inherit}button,a.button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);text-decoration:none;cursor:pointer}button:hover,a.button:hover{background:var(--raised)}button:disabled,input:disabled,select:disabled{opacity:.6;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:18px 28px;border-bottom:1px solid var(--border)}h1{font-size:20px;margin:0}h1 span{color:var(--accent)}.subtitle{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}main{max-width:1500px;margin:auto;padding:24px 28px 40px}h2{font-size:20px;margin:0 0 6px}.scope-note{font-size:12px;color:var(--muted);margin:0 0 18px;overflow-wrap:anywhere}.controls{display:flex;align-items:flex-end;gap:12px 18px;flex-wrap:wrap;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:11px}.controls label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px}.controls input,.controls select{min-height:38px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);padding:7px 9px;max-width:100%}.controls input{width:100px}.controls button{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}.calculation-status{margin:18px 0;padding:18px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}.status-line{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}.calculation-status p{font-size:12px;color:var(--muted);margin:8px 0 0}.calculation-status[data-state=loading] .status-line:before{content:"";width:16px;height:16px;flex:none;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}.calculation-status[data-state=error] .status-line{color:var(--warn)}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.calculation-status[data-state=loading] .status-line:before{animation:none}}.hidden{display:none!important}.card-label,.card-note{color:var(--muted);font-size:12px}.small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.num{font-family:Consolas,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}table{width:100%;table-layout:fixed}th,td{text-align:right;padding:12px 10px;vertical-align:middle;border-bottom:1px solid var(--border)}th{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}th:first-child,td:first-child{text-align:left}tbody tr:last-child td{border-bottom:0}summary{cursor:pointer}#familyScroll{max-height:65vh}#familyWarnings{margin:12px 0;color:var(--warn);font-size:12px}#familyWarnings p{margin:5px 0}.family-link.button{display:block;min-height:30px;border:0;border-radius:0;padding:0;background:none;text-align:left;justify-content:initial}.family-link.button:hover{color:var(--accent)}.family-current{color:var(--accent)}.rule-note{margin:12px 0;color:var(--muted);font-size:12px}@media(max-width:700px){header{padding:14px 16px}main{padding:18px 16px}.controls{align-items:stretch;gap:12px}.controls label{flex:1 1 160px}.controls button{width:100%}}
.family-panel{margin-top:24px;padding:18px;border:1px solid var(--border);border-radius:11px;background:var(--panel);min-width:0}.family-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.family-heading h3{margin:0;font-size:16px}.family-heading label{display:flex;align-items:center;gap:8px;margin:0}.family-totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.family-total{border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--bg);min-width:0}.family-total strong{display:block;color:var(--accent);font:600 25px/1.5 Consolas,monospace;overflow-wrap:anywhere}.family-note{font-size:12px;color:var(--muted);margin:6px 0;overflow-wrap:anywhere}.family-state{min-height:20px;font-size:12px;color:var(--muted);margin:5px 0 10px}.family-state.bad{color:var(--warn)}.family-scroll{max-height:360px;overflow:auto;overflow-anchor:none;scrollbar-gutter:stable;container:family / inline-size;border:1px solid var(--border);border-radius:8px}.family-table{border-collapse:separate;border-spacing:0}.family-table th{position:sticky;top:0;z-index:2;background:var(--raised)}.family-table th:first-child{width:28%}.family-table td{font-size:12px}.family-link{display:block;border:0;background:none;padding:0;min-height:30px;text-align:left;color:var(--text);max-width:100%;overflow-wrap:anywhere;line-height:1.5}.family-link:hover{color:var(--accent);background:none}.family-link[aria-current=true]{color:var(--accent)}.family-role{font-size:11px;color:var(--muted);margin-top:3px}.family-share{display:block;height:3px;background:var(--raised);margin-top:6px;border-radius:3px;overflow:hidden}.family-share span{display:block;height:100%;background:var(--accent)}.family-breakdown>summary{cursor:pointer;min-height:36px;font-size:13px;padding:5px 0}.family-scroll:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@container family (max-width:850px){.family-table,.family-table>tbody{display:block}.family-table>thead{display:none}.family-table>tbody>tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px;border-bottom:1px solid var(--border)}.family-table>tbody>tr>td{display:block;padding:0;border:0;text-align:left}.family-table>tbody>tr>td:first-child{grid-column:1/-1}.family-table>tbody>tr>td:not(:first-child):before{content:attr(data-label);display:block;font:11px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--muted);margin-bottom:4px}}@container family (max-width:480px){.family-table>tbody>tr{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.family-panel{padding:12px}.family-totals{grid-template-columns:minmax(0,1fr)}.family-total strong{font-size:23px}}
</style>
</head>
<body>
<header><div><h1>Codex <span>TPS Live</span></h1><div class="subtitle">代理消耗统计 · 按需计算</div></div><div class="actions"><a id="back" class="button" href="/">返回对话明细</a><button id="theme" type="button">浅色主题</button></div></header>
<main>
<h2>主代理与子代理消耗</h2><p class="scope-note">合计主代理、全部嵌套子代理及归档记录，按对话 ID 去重；缓存和推理作为分项，不重复相加。</p>
<form id="settings" class="controls">
<label for="familyScope">汇总范围<select id="familyScope"><option value="all">累计全部轮次</option><option value="window">每个代理最近 N 轮</option></select></label>
<label for="familyWindow">轮数 N<input id="familyWindow" type="number" min="1" max="1000000" step="1" value="10"></label>
<label for="creditBasis">计价口径<select id="creditBasis"><option value="included">订阅内含额度</option><option value="credits">购买积分</option></select></label>
<label for="creditContext">上下文<select id="creditContext"><option value="standard">Codex 标准积分</option><option value="api_assumption">API 长上下文假设（Codex 未确认）</option></select></label>
<button id="calculate" type="submit">计算</button>
</form>
<section id="calculationStatus" class="calculation-status" data-state="loading" role="status" aria-live="polite"><div id="statusTitle" class="status-line">计算中…</div><p id="statusDetail">正在读取代理关联与历史记录，完成后显示总量、各代理消耗及占比。</p></section>
<section id="results" class="family-panel hidden" aria-label="代理消耗统计结果" aria-busy="true">
<div class="family-heading"><h3>统计结果</h3><span id="calculatedAt" class="family-note"></span></div><p id="familyRoot" class="family-note"></p>
<div class="family-totals"><div class="family-total"><span class="card-label">总 Token · 输入＋输出</span><strong id="familyTokens">—</strong><div id="familyTokenParts" class="card-note"></div></div><div class="family-total"><span class="card-label">预计总积分</span><strong id="familyCredits">—</strong><div id="familyCreditCoverage" class="card-note"></div></div></div>
<p id="familyCreditNote" class="family-note"></p><div id="familyWarnings" class="hidden"></div>
<details class="family-breakdown" open><summary id="familyBreakdownLabel">各代理消耗与占比</summary><div id="familyScroll" class="family-scroll" tabindex="0" role="region" aria-label="各代理消耗，内容可滚动，表头固定"><table class="family-table"><thead><tr><th scope="col">代理</th><th scope="col">总 Token</th><th scope="col">输入</th><th scope="col">输出</th><th scope="col">Token 占比</th><th scope="col">预计积分</th><th scope="col" id="familyCreditShareHeading">积分占比</th></tr></thead><tbody id="familyMembers"></tbody></table></div></details>
<p id="creditRuleNote" class="rule-note"></p><p class="family-note">本页按次计算，结果不会自动刷新；点击“重新计算”获取最新记录。预计积分是等效消耗估计，按每次响应的模型和历史速度档位计价。只包含本机仍可读取且能识别关联的日志。</p>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),id=params.get('id')||'',nf=new Intl.NumberFormat('zh-CN'),cf=new Intl.NumberFormat('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=n=>nf.format(n||0);
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
function creditText(c){const priced=c.priced_responses||0,unpriced=c.unpriced_responses||0;if(!priced&&!unpriced)return cf.format(0);if(c.value==null||!priced)return '未知';return (unpriced?'≥':'≈')+cf.format(c.value)+(unpriced?'（部分）':'');}
function creditCoverage(c){return '计价 '+fmt(c.priced_responses)+' / '+fmt((c.priced_responses||0)+(c.unpriced_responses||0))+' 响应'+(c.unpriced_responses?' · 未计价 '+fmt(c.unpriced_responses):'')+(c.long_context_responses?' · 长上下文 '+fmt(c.long_context_responses):'');}
function agentName(s){return (s.agent_path||'').replace(/\/+$/,'').split('/').pop()||s.agent_nickname||'';}
const stored=(key,fallback)=>{try{return localStorage.getItem(key)||fallback;}catch{return fallback;}};
const basis=params.get('basis')||stored('codex-tps-live-credit-basis','included'),context=params.get('context')||stored('codex-tps-live-credit-context','standard'),windowValue=Number(params.get('turns')||stored('codex-tps-live-window','10'));
$('creditBasis').value=['included','credits'].includes(basis)?basis:'included';$('creditContext').value=['standard','api_assumption'].includes(context)?context:'standard';$('familyWindow').value=Number.isInteger(windowValue)&&windowValue>=1&&windowValue<=1000000?windowValue:10;$('familyScope').value=stored('codex-tps-live-family-scope','all')==='window'?'window':'all';
const backURL=new URL('/',location.origin);if(id)backURL.searchParams.set('id',id);$('back').href=backURL.pathname+backURL.search;
let light=stored('codex-tps-live-theme','dark')==='light';function theme(){document.documentElement.classList.toggle('light',light);$('theme').textContent=light?'深色主题':'浅色主题';}theme();$('theme').onclick=()=>{light=!light;theme();try{localStorage.setItem('codex-tps-live-theme',light?'light':'dark');}catch{}};
let busy=false,timer=null;
function setBusy(value){busy=value;for(const key of ['familyScope','creditBasis','creditContext','calculate'])$(key).disabled=value;$('familyWindow').disabled=value||$('familyScope').value!=='window';$('calculate').textContent=value?'计算中…':'重新计算';$('results').setAttribute('aria-busy',String(value));}
function status(kind,title,detail){$('calculationStatus').dataset.state=kind;$('statusTitle').textContent=title;$('statusDetail').textContent=detail;}
$('familyScope').onchange=()=>{$('familyWindow').disabled=$('familyScope').value!=='window';};
function cell(label,value,cls='num'){const n=el('td',cls,value);n.dataset.label=label;return n;}
function shareCell(label,value){const c=cell(label,value==null?'—':value.toFixed(1)+'%');if(value!=null){const bar=el('span','family-share'),fill=el('span');fill.style.width=Math.max(0,Math.min(100,value))+'%';bar.append(fill);c.append(bar);}return c;}
function render(f,request){
 const root=f.members.find(row=>row.id===f.root_id),partial=f.credits.unpriced_responses>0;
 $('familyRoot').textContent='主代理：'+(root?.title||f.root_id)+' · '+fmt(Math.max(0,f.members.length-1))+' 个子代理（含嵌套） · '+(f.scope==='all'?'累计全部轮次':'每个代理最近 '+f.window+' 轮');
 $('familyTokens').textContent=fmt(f.total_tokens);$('familyTokenParts').textContent='输入 '+fmt(f.tokens.input)+' · 输出 '+fmt(f.tokens.output)+' · '+fmt(f.responses)+' 次响应';$('familyCredits').textContent=creditText(f.credits);$('familyCreditCoverage').textContent=creditCoverage(f.credits);
 $('familyCreditNote').textContent=partial?'积分占比仅比较已计价部分；未计价消耗未当作零。':'Token 与积分占比使用同一统计范围；总量为零时不计算占比。';
 $('familyWarnings').replaceChildren(...f.warnings.map(text=>el('p','',text)));$('familyWarnings').classList.toggle('hidden',!f.warnings.length);$('familyCreditShareHeading').textContent=partial?'已计价积分占比':'积分占比';$('familyBreakdownLabel').textContent='各代理消耗与占比 · '+fmt(f.members.length)+' 个代理';
 const body=document.createDocumentFragment();for(const row of f.members){const tr=el('tr'),identity=cell('代理','',''),name=(row.depth===0?'主代理 · ':'子代理 · ')+(agentName(row)||row.title||'未命名代理'),url=new URL('/',location.origin);url.searchParams.set('id',row.id);url.searchParams.set('basis',request.basis);url.searchParams.set('context',request.context);const link=row.available?el('a','button family-link',name):el('span','family-link',name);if(row.available)link.href=url.pathname+url.search;if(row.id===id)link.setAttribute('aria-current','true');link.title=[row.agent_path,row.title,row.id].filter(Boolean).join('\n');identity.append(link,el('div','family-role',[row.depth>1?'嵌套 '+row.depth+' 级':'',row.archived?'已归档':'',fmt(row.turns)+' 轮',fmt(row.responses)+' 次响应'].filter(Boolean).join(' · ')));if(row.model)identity.append(el('div','small',row.model));const input=cell('输入',fmt(row.tokens.input)),output=cell('输出',fmt(row.tokens.output)),credits=cell('预计积分',creditText(row.credits));input.append(el('span','small','缓存命中 '+fmt(row.tokens.cached)));output.append(el('span','small','推理 '+fmt(row.tokens.reasoning)));credits.title=creditCoverage(row.credits);tr.append(identity,cell('总 Token',fmt(row.total_tokens)),input,output,shareCell('Token 占比',row.token_share_percent),credits,shareCell(partial?'已计价积分占比':'积分占比',row.credit_share_percent));body.append(tr);}
 $('familyMembers').replaceChildren(body);$('familyScroll').scrollTop=0;$('calculatedAt').textContent='计算完成于 '+new Date().toLocaleString('zh-CN',{hour12:false});const r=f.credit_rules;$('creditRuleNote').textContent=(request.basis==='credits'?'购买积分':'订阅内含额度')+' · '+(request.context==='api_assumption'?'API 长上下文假设，Codex 未确认':'Codex 标准积分')+(r?.as_of?' · 规则 '+r.as_of:'');$('results').classList.remove('hidden');
}
async function poll(request){
 try{const url=new URL('/api/family',location.origin);for(const [key,value]of Object.entries(request))url.searchParams.set(key,value);const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!response.ok)throw new Error('HTTP '+response.status);const f=await response.json();
 if(f.pending){status('loading','计算中…','正在读取代理关联与历史记录 · 已发现 '+fmt(f.members.length)+' 个代理 · 已加载 '+fmt(f.responses)+' 次响应'+(f.members.some(row=>row.pending)?' · '+fmt(f.members.filter(row=>row.pending).length)+' 个代理仍在补读':''));timer=setTimeout(()=>poll(request),1000);return;}
 render(f,request);setBusy(false);status('done',f.warnings.length?'计算完成 · 请留意记录缺失提示':'计算完成','已展示本次统计结果，可修改范围后点击“重新计算”。');
 }catch(error){setBusy(false);$('calculate').textContent='重试计算';status('error','计算失败',error.message==='HTTP 404'?'未找到对应对话，请返回对话明细重新选择，或稍后重试。':'读取本机记录失败（'+error.message+'），请点击“重试计算”。');}
}
function calculate(){if(busy)return;const turns=Number($('familyWindow').value);if(!Number.isInteger(turns)||turns<1||turns>1000000){status('error','轮数无效','请输入 1–1,000,000 的整数。');return;}if(!id){status('error','未选择对话','请返回对话明细，选择一个对话后点击“代理消耗统计”。');return;}clearTimeout(timer);const request={id,scope:$('familyScope').value,turns:String(turns),basis:$('creditBasis').value,context:$('creditContext').value};try{localStorage.setItem('codex-tps-live-family-scope',request.scope);}catch{}$('results').classList.add('hidden');setBusy(true);status('loading','计算中…','正在读取代理关联与历史记录，完成后显示总量、各代理消耗及占比。');poll(request);}
$('settings').onsubmit=event=>{event.preventDefault();calculate();};calculate();
</script>
</body>
</html>
