[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-tps"
version = "0.1.1"
description = "Export effective tokens-per-second data and charts from Codex sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Andrew" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "matplotlib>=3.8",
]

[project.scripts]
codex-tps = "codex_tps.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_tps"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
